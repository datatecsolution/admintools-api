server.port=${SERVER_PORT:80}

# Toda la configuracion sensible (datasource, JWT secret, CORS) DEBE venir
# por variables de entorno en este perfil. Ver .env.example en la raiz del
# proyecto.
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB}?serverTimezone=${MYSQL_TZ:GMT-6}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# Datasource de tenants (BDs por caja admin_tools_caja_N) — mismo servidor y
# credenciales que la BD comun. Sin esto MultiTenantConfig no levanta (el
# contenedor viejo de Ronal es anterior al multi-tenant; cualquier redeploy
# de la API actual necesita estas properties).
tenant.datasource.url-prefix=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/
tenant.datasource.url-suffix=?serverTimezone=${MYSQL_TZ:GMT-6}
tenant.datasource.username=${MYSQL_USER}
tenant.datasource.password=${MYSQL_PASSWORD}

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:518400000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# US-049 (Fase 4 OWASP): en produccion NO exponer el mapa de endpoints ni el
# try-it-out. El host publico (pedidos.distribuidorasharon.com) no debe publicar
# Swagger/OpenAPI a anonimos. Con esto los paths permitAll de swagger dan 404.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# US-049: HSTS se emite solo sobre canal seguro. Tras el proxy TLS (nginx) la API
# ve HTTP; esto le hace confiar en X-Forwarded-* para emitir HSTS y armar URLs.
server.forward-headers-strategy=framework

app.timezone=${APP_TIMEZONE:America/Tegucigalpa}

# Upload de imagenes (US-030). En container montar un volumen en /app/uploads.
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:6MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:8MB}
