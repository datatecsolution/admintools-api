spring.profiles.active=dev
server.servlet.context-path=/admin_tools/api
# US-101: Flyway solo se usa programaticamente al provisionar cajas nuevas
# (CajaProvisioner). Sin esto la auto-config correria contra admin_tools y
# crearia una flyway_schema_history espuria.
spring.flyway.enabled=false

# US-100: secreto del QR de reimpresión (vacío = apagado; setear por cliente).
app.public-invoice.secret=${APP_PUBLIC_INVOICE_SECRET:}
