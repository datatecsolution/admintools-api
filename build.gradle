plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.2'
    id 'io.spring.dependency-management' version '1.1.2'
}

group = 'net.datatecsolution'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '20'
}

repositories {
    mavenLocal()  // para resolver admintools-core publicado localmente
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    // Modulo compartido con el Swing (logica pura, calculos financieros).
    // Publicarlo primero con:
    //   cd /Users/jdmayorga/IdeaProjects/adminTools
    //   ./gradlew :admintools-core:publishToMavenLocal
    // Descomentar cuando se necesite (FacturaController en US-020).
    // implementation 'net.datatecsolution:admintools-core:0.1.0-SNAPSHOT'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation group: 'mysql', name: 'mysql-connector-java', version: '8.0.33'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    implementation 'org.slf4j:slf4j-api'
    implementation 'ch.qos.logback:logback-classic'
    implementation 'org.jboss.logging:jboss-logging:3.4.1.Final'


    //para menejar users
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.security:spring-security-config'
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation group: 'org.springframework', name: 'spring-jdbc', version: '6.1.12'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

}

tasks.named('test') {
    useJUnitPlatform()
}
