plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.2'
    id 'io.spring.dependency-management' version '1.1.2'
}

group = 'net.datatecsolution'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '20'
}

repositories {
    mavenLocal()  // para resolver admintools-core publicado localmente
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    // Modulo compartido con el Swing (logica pura, calculos financieros).
    // Habilitado en US-016 para que los controllers de Sprint 3+
    // (FacturaController, etc.) puedan inyectar FacturacionCalculadora
    // y demas servicios de core sin re-implementar logica.
    //
    // Si el JAR no se resuelve, republicar desde el repo del Swing con:
    //   cd /Users/jdmayorga/IdeaProjects/adminTools
    //   ./gradlew :admintools-core:publishToMavenLocal
    implementation 'net.datatecsolution:admintools-core:0.1.0-SNAPSHOT'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // US-019: validacion de DTOs de entrada (@Valid, @NotBlank, etc.)
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // US-033: @WithMockUser para probar @PreAuthorize en los slices @WebMvcTest
    testImplementation 'org.springframework.security:spring-security-test'
    implementation group: 'mysql', name: 'mysql-connector-java', version: '8.0.33'

    // US-101: Flyway embebido SOLO para provisionar la BD de una caja nueva
    // (POST /cajas replica SchemaMigrator.migrateNewCajaDatabase del Swing).
    // La auto-config queda apagada (spring.flyway.enabled=false); el dueño de
    // las migraciones en runtime normal sigue siendo el Swing.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    implementation 'org.slf4j:slf4j-api'
    implementation 'ch.qos.logback:logback-classic'
    implementation 'org.jboss.logging:jboss-logging:3.4.1.Final'


    //para menejar users
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.security:spring-security-config'
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation group: 'org.springframework', name: 'spring-jdbc', version: '6.1.12'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

}

tasks.named('test') {
    useJUnitPlatform()
}
